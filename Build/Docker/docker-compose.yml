services:
  ubuntu24:
    build:
      context: .
      dockerfile: Dockerfile_ubuntu24
    volumes:
      - ../..:/TeamTalk5:rw,z
    user: "${LOCAL_UID:?set LOCAL_UID and LOCAL_GID from id -u and id -g}:${LOCAL_GID:?set LOCAL_UID and LOCAL_GID from id -u and id -g}"
    working_dir: /TeamTalk5

